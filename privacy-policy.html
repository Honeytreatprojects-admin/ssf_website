<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Read the Samson Soyebi Foundation Data Privacy Policy.">
<title>Data Privacy Policy — Samson Soyebi Foundation</title>
<link rel="stylesheet" href="shared.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all';this.onload=null;" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=DM+Sans:wght@300;400;500;600&display=swap">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=DM+Sans:wght@300;400;500;600&display=swap"></noscript>
<style>
  .privacy-content { background: var(--ssf-cream); }
  .privacy-document { max-width: 1040px; margin: 0 auto; }
  .privacy-document-tools { display: flex; justify-content: flex-end; margin-bottom: 16px; }
  .privacy-document-tools a { display: inline-flex; align-items: center; gap: 8px; padding: 11px 16px; border-radius: 8px; background: var(--ssf-green); color: white; font-weight: 600; text-decoration: none; }
  .privacy-document-tools a:hover { background: var(--ssf-green-light); }
  .privacy-document iframe { display: block; width: 100%; height: min(82vh, 1100px); min-height: 620px; border: 1px solid var(--ssf-border); border-radius: 12px; background: white; }
  .privacy-document-fallback { margin: 14px 0 0; color: var(--ssf-muted); font-size: 14px; line-height: 1.7; }
  .privacy-document-fallback a { color: var(--ssf-green); font-weight: 600; }
  @media (max-width: 600px) { .privacy-document iframe { height: 75vh; min-height: 520px; } }
</style>
</head>
<body data-page="privacy">
<main>
  <section class="page-hero">
    <div class="page-hero-inner">
      <div class="page-hero-breadcrumb"><a href="index">Home</a><span>/</span><strong>Privacy Policy</strong></div>
      <span class="page-hero-tag">Your Privacy</span>
      <h1>Data Privacy <em>Policy</em></h1>
      <p>The Samson Soyebi Foundation policy for handling personal data.</p>
    </div>
  </section>
  <section class="content-section privacy-content" aria-label="Samson Soyebi Foundation Data Privacy Policy">
    <div class="privacy-document">
      <div class="privacy-document-tools">
        <a href="Samson_Soyebi_Foundation_Data_Privacy_Policy.pdf" target="_blank" rel="noopener noreferrer" aria-label="Open the Data Privacy Policy PDF in a new tab">Open or download PDF</a>
      </div>
      <iframe src="Samson_Soyebi_Foundation_Data_Privacy_Policy.pdf" title="Samson Soyebi Foundation Data Privacy Policy PDF">
        <p>Your browser cannot display the policy inline. <a href="Samson_Soyebi_Foundation_Data_Privacy_Policy.pdf">Open the Data Privacy Policy PDF</a>.</p>
      </iframe>
      <p class="privacy-document-fallback">If the document does not appear above, <a href="Samson_Soyebi_Foundation_Data_Privacy_Policy.pdf">open or download the PDF</a>.</p>
    </div>
  </section>
</main>
<script src="shared.js"></script>
